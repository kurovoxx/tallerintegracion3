services:
  postgres:
    image: postgres:16-alpine
    container_name: ti3-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: esomeprazol2002
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ti3-net

  auth:
    build:
      context: ./back/auth
      dockerfile: Dockerfile
    container_name: ti3-auth
    ports:
      - "8085:8080" # host 8081 reservado para callback OAuth local de Drive -> auth en 8085
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      DIRECT_URL: ${DOCKER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT: ${JWT}
      PORT: 8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      SUPABASE_URL: ${SUPABASE_URL}
      DISCOVERY_URL: ${DISCOVERY_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ti3-net
    restart: unless-stopped

  notes:
    build:
      context: ./back/notes
      dockerfile: Dockerfile
    container_name: ti3-notes
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      DIRECT_URL: ${DOCKER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT: ${JWT}
      PORT: 8082
      NOTES_PORT: 8082
      STORAGE_MODE: drive
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ti3-net
    restart: unless-stopped

  social:
    build:
      context: ./back/social
      dockerfile: Dockerfile
    container_name: ti3-social
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgresql://postgres:esomeprazol2002@postgres:5432/postgres?sslmode=disable
      DIRECT_URL: postgresql://postgres:esomeprazol2002@postgres:5432/postgres?sslmode=disable
      JWT_SECRET: 5987f6ae236ec37e229aaf3bcbd488b0ca3aa8c1c980a3a699ac47e42402e41f
      JWT: 961e9b2e-0333-4ec9-aadb-72e95ca06e4d
      PORT: 8083
      SOCIAL_PORT: 8083
      AUTH_BASE_URL: http://auth:8080
      INTERNAL_API_KEY: dev-internal-key-change-me
      CALENDAR_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ti3-net
    restart: unless-stopped

  # Frontend Flutter Web (nginx) - estatico para test login contra tunel publico actual
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        BASE_URL: https://gcc-too-virgin-rhode.trycloudflare.com/api-auth
        NOTES_BASE_URL: https://gcc-too-virgin-rhode.trycloudflare.com/api-notes
        SOCIAL_BASE_URL: https://gcc-too-virgin-rhode.trycloudflare.com/api-social
    container_name: ti3-front
    ports:
      - "8086:80"
    depends_on:
      - auth
      - notes
      - social
    networks:
      - ti3-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ti3-net:
    driver: bridge
