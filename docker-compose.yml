services:
  postgres:
    image: postgres:16-alpine
    container_name: ti3-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: esomeprazol2002
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ti3-net

  auth:
    build:
      context: ./back/auth
      dockerfile: Dockerfile
    container_name: ti3-auth
    ports:
      - "8085:8080" # host 8081 reservado para callback OAuth local de Drive -> auth en 8085
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:esomeprazol2002@postgres:5432/postgres?sslmode=disable}
      DIRECT_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:esomeprazol2002@postgres:5432/postgres?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      JWT: ${JWT}
      PORT: 8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      SUPABASE_URL: ${SUPABASE_URL}
      DISCOVERY_URL: ${DISCOVERY_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ti3-net
    restart: unless-stopped

  notes:
    build:
      context: ./back/notes
      dockerfile: Dockerfile
    container_name: ti3-notes
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:esomeprazol2002@postgres:5432/postgres?sslmode=disable}
      DIRECT_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:esomeprazol2002@postgres:5432/postgres?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      JWT: ${JWT}
      PORT: 8082
      NOTES_PORT: 8082
      STORAGE_MODE: drive
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SOCIAL_SERVICE_URL: ${SOCIAL_SERVICE_URL:-http://social:8083}
      SOCIAL_TIMEOUT: 5s
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ti3-net
    restart: unless-stopped

  social:
    build:
      context: ./back/social
      dockerfile: Dockerfile
    container_name: ti3-social
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:esomeprazol2002@postgres:5432/postgres?sslmode=disable}
      DIRECT_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:esomeprazol2002@postgres:5432/postgres?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      JWT: ${JWT}
      PORT: 8083
      SOCIAL_PORT: 8083
      AUTH_BASE_URL: http://auth:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      CALENDAR_MODE: mock
      STREAM_API_KEY: ${STREAM_API_KEY}
      STREAM_API_SECRET: ${STREAM_API_SECRET:-dev-stream-secret-change-me}
      STREAM_MODE: ${STREAM_MODE:-mock}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ti3-net
    restart: unless-stopped

  # Frontend Flutter Web (nginx) - estatico, apunta a los endpoints publicos de pillan (Ingress ti3-brojas.dev.censei.cl)
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        BASE_URL: ${API_BASE_URL:-http://localhost:8085}
        NOTES_BASE_URL: ${NOTES_BASE_URL:-http://localhost:8082}
        SOCIAL_BASE_URL: ${SOCIAL_BASE_URL:-http://localhost:8083}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/auth/google/callback}
    container_name: ti3-front
    ports:
      - "8086:80"
    depends_on:
      - auth
      - notes
      - social
    networks:
      - ti3-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  ti3-net:
    driver: bridge
