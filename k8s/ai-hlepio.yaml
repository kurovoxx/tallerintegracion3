# Microservicio IA (PDF -> Markdown con Gemini) desplegado en student-hlepio.
# Imagen pública en GHCR: no requiere imagePullSecret.
# Secret opcional "ai-secrets" (GEMINI_API_KEY, INTERNAL_API_KEY); sin él el servicio corre en modo mock.
#   kubectl -n student-hlepio create secret generic ai-secrets --from-literal=GEMINI_API_KEY=... --from-literal=INTERNAL_API_KEY=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: student-hlepio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ai}
  template:
    metadata:
      labels: {app: ai}
    spec:
      containers:
        - name: ai
          image: ghcr.io/kurovoxx/tallerintegracion3-ai:latest
          imagePullPolicy: Always
          ports: [{containerPort: 8084}]
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          # GEMINI_API_KEY, GEMINI_MODEL, etc. vienen del Secret (creado a mano, nunca en Git).
          envFrom: [{secretRef: {name: ai-secrets, optional: true}}]
          env:
            - {name: PORT, value: "8084"}
            - {name: AI_PORT, value: "8084"}
          readinessProbe:
            httpGet: {path: /health, port: 8084}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8084}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: student-hlepio
spec:
  selector: {app: ai}
  ports: [{name: http, port: 80, targetPort: 8084}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai
  namespace: student-hlepio
  annotations:
    external-dns.alpha.kubernetes.io/target: "proxy.inf.uct.cl"
    # PDFs de hasta 10MB + overhead multipart (el default de nginx-ingress es 1m).
    nginx.ingress.kubernetes.io/proxy-body-size: "15m"
    # CORS resuelto en el ingress mientras el servicio Go no tenga middleware propio.
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Internal-Key"
spec:
  ingressClassName: nginx
  rules:
    - host: ia-hlepio.dev.censei.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: ai, port: {number: 80}}
