# Publica el front en https://ti3-brojas.dev.censei.cl (manual vcluster UCT, sección 11).
# El front (nginx) ya reenvía /api-auth, /api-notes y /api-social a los servicios del cluster.
# La anotación external-dns la exige la plataforma y no debe modificarse.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front
  annotations:
    external-dns.alpha.kubernetes.io/target: proxy.inf.uct.cl
spec:
  ingressClassName: nginx
  rules:
    - host: ti3-brojas.dev.censei.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: front, port: {number: 80}}
