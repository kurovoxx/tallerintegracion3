# Tunel publico (Cloudflare quick tunnel) hacia el front, sin cuenta ni IP publica.
# La URL https://*.trycloudflare.com aparece en los logs: kubectl logs deploy/tunnel
# Cambia cada vez que el pod se reinicia. Para URL fija hace falta cuenta Cloudflare + dominio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: tunnel}
  template:
    metadata:
      labels: {app: tunnel}
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://front:80"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
