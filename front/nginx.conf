server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Proxy a los backends del cluster: el front y las APIs salen por un solo origen.
    # /internal de auth no se expone.
    location /api-auth/internal/ { return 404; }

    # CORS para cuando front en localhost:8086 pega a https://dominio/api-* (deploy)
    # Resolver para no fallar al iniciar si auth/notes/social no están (run-deploy solo front)
    # El if va antes del rewrite: "rewrite ... break" corta la fase rewrite y un if posterior nunca corre.
    location /api-auth/ {
        resolver 127.0.0.11 valid=10s;
        if ($request_method = OPTIONS) { return 204; }
        rewrite ^/api-auth/(.*)$ /$1 break;
        proxy_pass http://auth:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Id" always;
    }

    location /api-notes/ {
        resolver 127.0.0.11 valid=10s;
        if ($request_method = OPTIONS) { return 204; }
        rewrite ^/api-notes/(.*)$ /$1 break;
        proxy_pass http://notes:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Id" always;
    }

    location /api-social/ {
        resolver 127.0.0.11 valid=10s;
        rewrite ^/api-social/(.*)$ /$1 break;
        proxy_pass http://social:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Sin add_header CORS: social ya lo pone en Go (corsMiddleware en back/social/cmd/server/main.go)
        # y duplicarlo deja "Access-Control-Allow-Origin: *, *", que el navegador rechaza.
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
