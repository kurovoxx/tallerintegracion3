server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Proxy a los backends del cluster: el front y las APIs salen por un solo origen.
    # /internal de auth no se expone.
    location /api-auth/internal/ { return 404; }

    # Se procesa como template (envsubst de la imagen nginx, ver Dockerfile).
    # Resolver en runtime para no fallar al iniciar si auth/notes/social no están (run-deploy solo front).
    # NGINX_LOCAL_RESOLVERS sale de /etc/resolv.conf: 127.0.0.11 en Docker, CoreDNS en k8s.
    # El resolver de nginx no usa los "search" de resolv.conf: en k8s UPSTREAM_SUFFIX
    # completa el FQDN (.<namespace>.svc.cluster.local); en Docker va vacío.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # CORS para cuando front en localhost:8086 pega a https://dominio/api-* (deploy)
    # El if va antes del rewrite: "rewrite ... break" corta la fase rewrite y un if posterior nunca corre.
    location /api-auth/ {
        set $auth_upstream auth${UPSTREAM_SUFFIX}:8080;
        if ($request_method = OPTIONS) { return 204; }
        rewrite ^/api-auth/(.*)$ /$1 break;
        proxy_pass http://$auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Id" always;
    }

    location /api-notes/ {
        set $notes_upstream notes${UPSTREAM_SUFFIX}:8082;
        if ($request_method = OPTIONS) { return 204; }
        rewrite ^/api-notes/(.*)$ /$1 break;
        proxy_pass http://$notes_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-User-Id" always;
    }

    location /api-social/ {
        set $social_upstream social${UPSTREAM_SUFFIX}:8083;
        rewrite ^/api-social/(.*)$ /$1 break;
        proxy_pass http://$social_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Sin add_header CORS: social ya lo pone en Go (corsMiddleware en back/social/cmd/server/main.go)
        # y duplicarlo deja "Access-Control-Allow-Origin: *, *", que el navegador rechaza.
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}