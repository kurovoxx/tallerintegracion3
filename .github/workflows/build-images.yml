name: build-images

# Compila auth, notes, social y front y los sube a GHCR (ghcr.io/<owner>/tallerintegracion3-<servicio>).
# No despliega: para actualizar pillan, reiniciar los deployments (kubectl rollout restart).
on:
  push:
    branches: [Development]
    paths: ["back/**", "front/**", ".github/workflows/build-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: auth, context: back/auth}
          - {name: notes, context: back/notes}
          - {name: social, context: back/social}
          # El front en pillan usa rutas relativas: nginx reenvia /api-* a los servicios del cluster.
          - name: front
            context: front
            build_args: |
              BASE_URL=/api-auth
              NOTES_BASE_URL=/api-notes
              SOCIAL_BASE_URL=/api-social
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tallerintegracion3-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/tallerintegracion3-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
