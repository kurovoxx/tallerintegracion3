# Copy of the Notes client stubs for Social. Services keep local generated
# code so their Go modules and deployment images remain independent.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/kurovoxx/tallerintegracion3/back/social/internal/gen/notesv1;notesv1
plugins:
  - local: protoc-gen-go
    out: ../../social
    opt: module=github.com/kurovoxx/tallerintegracion3/back/social
  - local: protoc-gen-go-grpc
    out: ../../social
    opt: module=github.com/kurovoxx/tallerintegracion3/back/social
