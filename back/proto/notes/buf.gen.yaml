# Generación Go del contrato Notes. Plugins locales instalados vía
# `go install` (versiones fijadas en generate.sh); no requiere protoc del sistema.
version: v1
plugins:
  - plugin: go
    out: ../../notes/internal/gen/notesv1
    opt: paths=source_relative
  - plugin: go-grpc
    out: ../../notes/internal/gen/notesv1
    opt: paths=source_relative
