# Copia del cliente para Social (los servicios no se importan entre sí y la
# imagen de Social solo ve back/social). Mismo contrato, otro go_package.
# Se corre desde back/proto/auth: buf generate --template buf.gen.social.yaml
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/kurovoxx/tallerintegracion3/back/social/internal/gen/identityv1;identityv1
plugins:
  - local: protoc-gen-go
    out: ../../social
    opt: module=github.com/kurovoxx/tallerintegracion3/back/social
  - local: protoc-gen-go-grpc
    out: ../../social
    opt: module=github.com/kurovoxx/tallerintegracion3/back/social
