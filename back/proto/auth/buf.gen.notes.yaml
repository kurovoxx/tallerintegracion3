# Copia del cliente para Notes (los servicios no se importan entre sí y la
# imagen de Notes solo ve back/notes). Mismo contrato, otro go_package.
# Se corre desde back/proto/auth: buf generate --template buf.gen.notes.yaml
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/kurovoxx/tallerintegracion3/back/notes/internal/gen/identityv1;identityv1
plugins:
  - local: protoc-gen-go
    out: ../../notes
    opt: module=github.com/kurovoxx/tallerintegracion3/back/notes
  - local: protoc-gen-go-grpc
    out: ../../notes
    opt: module=github.com/kurovoxx/tallerintegracion3/back/notes
